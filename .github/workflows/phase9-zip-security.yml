name: Phase 9 ZIP Security CI

on:
  pull_request:
    branches:
      - feat/oserp-unified-project-intake-p9
      - release/oserp-proj-uboq-001
  push:
    branches:
      - fix/oserp-phase9-zip-central-directory-20261118
      - feat/oserp-unified-project-intake-p9
      - release/oserp-proj-uboq-001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zip-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install lockfile dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test the real ZIP scanner
        run: node --test --test-name-pattern='real scanner' scripts/uboq/phase9-acceptance.test.cjs
      - name: Run complete credential-free Phase 9 acceptance fixture
        run: node --test scripts/uboq/phase9-acceptance.test.cjs
      - name: Test backend deployment packaging and CommonJS runtime imports
        run: node --test scripts/uboq/phase9-backend-vercel-packaging.test.cjs scripts/uboq/backend-runtime-packaging.test.cjs
      - name: Type-check ZIP security scanner and DOCX parser
        run: npx tsc --noEmit --pretty false --skipLibCheck --target ES2022 --module commonjs --moduleResolution node --types node --esModuleInterop src/lib/uboq/intake/security-guard.ts src/lib/uboq/intake/parsers.ts
      - name: Generate Prisma client for full-project typecheck
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://noaccess:noaccess@127.0.0.1:65535/typecheck_only
          DIRECT_URL: postgresql://noaccess:noaccess@127.0.0.1:65535/typecheck_only
      - name: Full-project TypeScript typecheck without production credentials
        run: npx tsc --noEmit --pretty false
